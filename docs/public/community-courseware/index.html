<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>走进我们的社区 · Our Community</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#e9f7fb;color:#24576a}
body{display:grid;place-items:center}
.loader{text-align:center;padding:28px}
.spinner{width:36px;height:36px;margin:0 auto 14px;border:4px solid #b9dfe8;border-top-color:#17889d;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#error{display:none;max-width:680px;line-height:1.7;color:#8b3232}
</style>
</head>
<body>
<div class="loader"><div class="spinner"></div><div>正在打开互动课件…</div><p id="error"></p></div>
<script>
(async()=>{
  try{
    const count=14, parts=[];
    for(let i=0;i<count;i++){
      const name=String(i).padStart(3,'0');
      const r=await fetch('./chunks/'+name+'.txt',{cache:'force-cache'});
      if(!r.ok) throw new Error('课件资源 '+name+' 加载失败（'+r.status+'）');
      parts.push(await r.text());
    }
    const source=parts.join('');
    document.open();
    document.write(source);
    document.close();
  }catch(e){
    document.querySelector('.spinner').style.display='none';
    const el=document.getElementById('error');
    el.style.display='block';
    el.textContent='课件加载失败：'+(e&&e.message?e.message:e);
  }
})();
</script>
</body>
</html>
